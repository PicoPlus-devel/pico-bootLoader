name: Build and create a release

# Two ways in:
#
#  1. Push a tag, as before:
#         git tag v0.n && git push origin v0.n
#
#  2. Run this workflow manually with a "tag" input:
#         gh workflow run BuildAndRelease.yml -f tag=v0.2.1
#     The release step then creates that tag itself (tag_name +
#     target_commitish), so a release can be cut without a tag push. This is how
#     an emulator-only refresh is published: the loader firmware is unchanged, but
#     the SD-card archive is new, so users still need a release to notice.
#     Dispatching with an empty tag builds everything and releases nothing.
#
# Tag convention:
#     v0.N     bootloader firmware release  — re-flash the board and refresh the card
#     v0.N.M   same firmware, refreshed emulator binaries — refresh the card only
on:
    push:
        tags:
          - "v*.*-alpha"
          - "v*.*.*"
          - "v*.*"
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to create and release (e.g. v0.2.1). Leave empty to build without releasing.'
                required: false
                type: string

# Must match the project() name in CMakeLists.txt
env:
    APP_NAME: pico-bootLoader

# Allow this workflow to write back to the repository
permissions:
    contents: write

jobs:
    build-release:
        runs-on: self-hosted
        name: Build loader and create release
        steps:

          - name: Check out this repository with submodules
            uses: actions/checkout@v6
            with:
                submodules: recursive

          - name: Resolve the tag to build and release
            id: ver
            run: |
                 if [ "${{ github.event_name }}" = "push" ]; then
                      tag="${GITHUB_REF#refs/tags/}"
                 else
                      tag="${{ inputs.tag }}"
                 fi
                 echo "Tag is '${tag}'"
                 if [ -z "$tag" ]; then
                      echo "No tag: building only, no release will be created."
                 fi
                 echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # updateAll.exe has a version of its own, in updateAll/win/VERSION. This stops
          # the release here, before the long build, when the program changed and that
          # number did not, and says whether this release attaches the program.
          - name: Check the version of updateAll.exe
            id: updateall
            if: steps.ver.outputs.tag != ''
            env:
                TAG: ${{ steps.ver.outputs.tag }}
                GITHUB_TOKEN: ${{ github.token }}
            run: python3 .github/scripts/updateall_version.py "$TAG"

          - name: Stamp the tag into CMakeLists.txt and pico_shared/menu.h
            if: steps.ver.outputs.tag != ''
            env:
                TAG: ${{ steps.ver.outputs.tag }}
            run: |
                 sed -i "s/^[[:space:]]*pico_set_program_version(.*/pico_set_program_version(${{ env.APP_NAME }} \"$TAG\")/" CMakeLists.txt
                 sed -i -E "s|^#define[[:space:]]+SWVERSION[[:space:]]+\".*\"|#define SWVERSION \"$TAG\"|" pico_shared/menu.h
                 grep "pico_set_program_version" CMakeLists.txt
                 grep SWVERSION pico_shared/menu.h

          - name: Build bootLoader for every RP2350 hardware configuration
            run: |
                 chmod +x build*.sh bld.sh pico_shared/bld.sh
                 export PICO_SDK_PATH=/datalocal/pico/pico-sdk
                 export PICO_PIO_USB_PATH=/datalocal/Pico-PIO-USB
                 ./buildAll.sh

          # updateAll.exe offers users an update of itself when a release holds a higher
          # version, which the name of this asset gives. It is built after buildAll.sh,
          # which deletes releases/.
          - name: Build updateAll.exe, to attach it (needs mingw-w64 on the runner)
            if: steps.updateall.outputs.attach == 'true'
            env:
                PROGRAM_VERSION: ${{ steps.updateall.outputs.version }}
            run: |
                 bash updateAll/win/build.sh
                 cp updateAll/win/build/updateAll.exe "releases/updateAll-$PROGRAM_VERSION.exe"

          - name: List release artifacts
            run: |
                 ls -l releases/

          # Release notes = CHANGELOG.md as written (its own title, intro, General
          # Info and the v0.N section), then the generated tail: for a v0.N.M tag a
          # note that the firmware did not change, and the emulator versions the
          # SD-card archive ships (emu/versions.txt, written by
          # build_emulators.sh -z and committed). The wrapped lines of each
          # paragraph are then joined (.github/scripts/unwrap_markdown.py).
          #
          # The table goes last on purpose: it closes the page just above the asset
          # list GitHub renders, which is what "at the end of this page" in the
          # CHANGELOG's General Info refers to.
          #
          # The SD-card archive itself is built locally, not here — see the release
          # procedure in RELEASING.md — and attached with `gh release upload`.
          - name: Generate release notes
            if: steps.ver.outputs.tag != ''
            env:
                TAG: ${{ steps.ver.outputs.tag }}
            run: |
                 cat CHANGELOG.md > release-notes.md
                 # A three-component tag (v0.N.M) means the loader firmware did not
                 # change; only the emulator binaries on the card did.
                 if [ "$(printf '%s' "$TAG" | tr -cd '.' | wc -c)" -ge 2 ]; then
                      baseline="${TAG%.*}"
                      {
                        echo
                        echo "> **SD-card content update.** The bootloader firmware is unchanged since"
                        echo "> [\`$baseline\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/$baseline) — you do **not** need to re-flash"
                        echo "> the board. Only the emulator binaries in \`pico-bootLoader_sdcard.zip\`"
                        echo "> changed; replace the \`/emu\` folder on the SD card."
                      } >> release-notes.md
                 fi
                 if [ -f emu/versions.txt ]; then
                      {
                        echo
                        echo "## Emulator versions in \`pico-bootLoader_sdcard.zip\`"
                        echo
                        echo "| Emulator | Repository | Version | pico_shared |"
                        echo "|---|---|---|---|"
                      } >> release-notes.md
                      while IFS=';' read -r prog repo ref shared || [ -n "$prog" ]; do
                          case "$prog" in ''|\#*) continue ;; esac
                          # A bare repo name lives under this owner; owner/repo is hosted elsewhere.
                          case "$repo" in */*) repo_path="$repo" ;; *) repo_path="${{ github.repository_owner }}/$repo" ;; esac
                          echo "| \`$prog\` | [$repo](https://github.com/$repo_path) | $ref | ${shared:-–} |" >> release-notes.md
                      done < emu/versions.txt
                 else
                      echo "NOTE: emu/versions.txt is absent; release notes carry no emulator version table." >&2
                 fi
                 # GitHub shows release notes like a comment, where every line break
                 # stays a break, so join the wrapped lines of each paragraph.
                 python3 .github/scripts/unwrap_markdown.py release-notes.md > release-notes.unwrapped.md
                 mv release-notes.unwrapped.md release-notes.md
                 echo "----- release-notes.md -----"
                 cat release-notes.md

          # tag_name + target_commitish let the action CREATE the tag, so a
          # workflow_dispatch run can publish a release without a tag push. (A tag
          # pushed by a workflow using the default GITHUB_TOKEN would not trigger
          # this workflow, so pushing one from CI is not an option.)
          - name: Create release
            uses: softprops/action-gh-release@v3
            if: steps.ver.outputs.tag != ''
            with:
              tag_name: ${{ steps.ver.outputs.tag }}
              target_commitish: ${{ github.sha }}
              name: ${{ steps.ver.outputs.tag }}
              body_path: release-notes.md
              # The PCB gerbers come from the pico_shared submodule (checked out
              # above with submodules: recursive) and are re-attached to every
              # release, so each release page carries the designs the CHANGELOG's
              # "Binaries for each configuration and PCB design" line promises:
              # PicoNES v2.6 and v2.8 (HW_CONFIG 2), Mini (6) and Micro (9).
              files: |
                releases/pico-bootLoader_*.uf2
                releases/updateAll-*.exe
                pico_shared/PCB/pico_nesPCB_v2.6.zip
                pico_shared/PCB/pico_nesPCB_v2.8_SNES_PORTS.zip
                pico_shared/PCB/Gerber_PicoNES_Mini_PCB_v2.0.zip
                pico_shared/PCB/Gerber_PicoNES_Micro_v1.2.zip
